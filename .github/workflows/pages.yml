name: Publikacja strony

# Publikuje strone na GitHub Pages:
#  - po kazdej zmianie w repozytorium,
#  - co 5 minut (odswieza wtedy liczby i filmy z TikToka; 5 minut to najczestszy
#    odstep, jaki GitHub dopuszcza, a przy duzym ruchu na GitHubie bywa dluzej),
#  - na zadanie (zakladka Actions -> Publikacja strony -> Run workflow).
on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Publikujemy tylko z glownej galezi repozytorium
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Baza to dane z dzialajacej strony, nie te z repozytorium (sa starsze). Dzieki temu,
      # gdy TikTok chwilowo nie odda liczb, strona zostaje przy ostatnich znanych, a nie cofa sie.
      - name: Wez ostatnie dane z dzialajacej strony
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --max-time 30 "https://${{ github.repository_owner }}.github.io/data/tiktok.js" -o /tmp/live-tiktok.js
          if grep -q '^window.TIKTOK_DATA' /tmp/live-tiktok.js; then
            cp /tmp/live-tiktok.js data/tiktok.js
            echo "Wczytano dane z dzialajacej strony"
          fi

      - name: Odswiez dane z TikToka
        run: |
          pip install --quiet pillow
          python scripts/update_tiktok.py
          # obrazy podgladu linkow do klipow (assets/og/), patrz worker/README.md; gdy sie nie uda, strona i tak sie publikuje
          python scripts/make_previews.py || echo "::warning::Nie udalo sie zrobic obrazow podgladu klipow"

      - name: Zloz strone
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml site.webmanifest favicon.ico css js assets data admin _site/
          # plik weryfikacyjny Google Search Console (google1234abcd.html), jesli jest w repozytorium
          cp google*.html _site/ 2>/dev/null || true
          # numer wersji w adresach plikow (patrz komentarz w index.html)
          sed -i "s/?v=dev/?v=$(date -u +%Y%m%d%H%M)/g" _site/index.html _site/404.html _site/admin/index.html _site/admin/setup.html
          # data ostatniej zmiany w mapie strony
          sed -i "s/LASTMOD/$(date -u +%Y-%m-%d)/" _site/sitemap.xml
          # dane o filmach dla Google (schema.org); gdy sie nie uda, strona i tak sie publikuje
          python scripts/inject_seo.py _site || echo "::warning::Nie udalo sie dodac danych o filmach dla Google"
          # male strony /k/NUMER/ do udostepniania klipow (podglad na Discordzie itp.); gdy sie nie uda, strona i tak sie publikuje
          python scripts/make_share_pages.py _site || echo "::warning::Nie udalo sie zrobic stron do udostepniania klipow"
          grep -c '?v=2' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub wylacza zaplanowane zadania po 60 dniach bez zmian w repozytorium.
      # To wywolanie zeruje ten licznik, wiec odswiezanie nie zgasnie po cichu.
      - name: Nie pozwol wylaczyc harmonogramu
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable pages.yml --repo "${{ github.repository }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
